<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.3"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#glow-grad)" filter="blur(20px)"/>

  <!-- Main Symbol: Graduation Cap + Sparkle / Target -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Graduation Cap Crown -->
    <path d="M256 120 L408 200 L256 280 L104 200 Z" fill="url(#accent-grad)"/>
    
    <!-- Cap Base Bottom -->
    <path d="M160 236 L160 310 C160 360, 352 360, 352 310 L352 236" fill="none" stroke="url(#accent-grad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Tassel -->
    <path d="M370 215 L400 290 L390 350" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="390" cy="355" r="12" fill="#f59e0b"/>

    <!-- Sparkle Stars -->
    <path d="M256 360 L262 380 L282 386 L262 392 L256 412 L250 392 L230 386 L250 380 Z" fill="#38bdf8"/>
    <path d="M140 150 L144 162 L156 166 L144 170 L140 182 L136 170 L124 166 L136 162 Z" fill="#f43f5e"/>
    <path d="M380 140 L383 150 L393 153 L383 156 L380 166 L377 156 L367 153 L377 150 Z" fill="#10b981"/>
  </g>
</svg>
